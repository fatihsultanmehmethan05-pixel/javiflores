# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: battery_depletion_formula
    status: active
    source: design/gdd/flashlight-power-system.md
    referenced_by:
      - design/gdd/flashlight-power-system.md
      - design/gdd/save-progression-system.md
    variables:
      - B_prev
      - r_drain
      - delta
    output_range: [0.0, 100.0]
    expression: "max(B_prev - r_drain * delta, 0.0)"
    added: 2026-08-11
    revised: ""

  - name: antenna_repair_formula
    status: target
    source: design/gdd/forest-antennae-system.md
    referenced_by:
      - design/gdd/forest-antennae-system.md
      - design/gdd/player-controller-fps.md
    variables:
      - P_prev
      - delta
      - has_fuse
      - is_crouching
    output_range: [0.0, 1.5]
    expression: "min(P_prev + delta, 1.5) if has_fuse and not is_crouching else max(P_prev - 2.0 * delta, 0.0)"
    added: 2026-08-11
    revised: ""

  - name: frequency_match_formula
    status: active
    source: design/gdd/tower-terminal-system.md
    referenced_by:
      - design/gdd/tower-terminal-system.md
      - design/gdd/save-progression-system.md
    variables:
      - M_prev
      - delta
      - freq_diff
      - tolerance
    output_range: [0.0, 100.0]
    expression: "min(M_prev + 60.0 * delta, 100.0) if freq_diff <= tolerance else max(M_prev - 30.0 * delta, 0.0)"
    added: 2026-08-11
    revised: ""

  - name: stealth_detection_formula
    status: active
    source: design/gdd/anomaly-entity-ai.md
    referenced_by:
      - design/gdd/anomaly-entity-ai.md
      - design/gdd/player-controller-fps.md
      - design/gdd/flashlight-power-system.md
      - design/gdd/diegetic-ui-system.md
    variables:
      - is_crouching
      - is_flashlight_on
    expression: "is_crouching and not is_flashlight_on"
    added: 2026-08-11
    revised: ""

